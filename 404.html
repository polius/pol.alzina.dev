    <style>
      .notfound { min-height: 100vh; display: grid; place-items: center; padding: 24px 20px; }
      .notfound-card {
        width: 100%;
        max-width: 520px;
        padding: 40px clamp(20px, 6vw, 36px);
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: var(--shadow-hover);
        -webkit-backdrop-filter: var(--surface-blur);
        backdrop-filter: var(--surface-blur);
      }
      .notfound-code { font: 700 clamp(72px, 20vw, 112px)/1 var(--font-display); letter-spacing: -0.02em; }
      .notfound-title { margin-top: 12px; font: 600 24px/1.3 var(--font-display); }
      .notfound-text { margin: 12px auto 0; max-width: 24rem; color: var(--muted); }
      .notfound .contact-links { justify-content: center; margin-top: 28px; }
      .notfound-footer {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px 16px;
        margin-top: 32px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
        font-size: 14px;
        font-weight: 500;
        color: var(--muted);
      }
      .notfound-footer .contact-links { margin-top: 0; justify-content: flex-end; gap: 4px; }
      .notfound-footer .social-link { font-size: 14px; }
    </style>
