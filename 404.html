<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Pol Alzina</title>
    <meta name="theme-color" content="#f6f3ee" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon/favicon-32x32.png" />
    <!-- Root-relative paths on purpose: this page is served for any missing URL, at any depth -->
    <link rel="preload" href="/fonts/rocio.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" />
    <link rel="stylesheet" href="/css/style.css" />
    <style>
      .notfound { min-height: 100vh; display: grid; place-items: center; padding: 24px 20px; }
      .notfound-card {
        width: 100%;
        max-width: 520px;
        padding: 40px clamp(20px, 6vw, 36px);
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: var(--shadow-hover);
        -webkit-backdrop-filter: var(--surface-blur);
        backdrop-filter: var(--surface-blur);
      }
      .notfound-code { font: 700 clamp(72px, 20vw, 112px)/1 var(--font-display); letter-spacing: -0.02em; }
      .notfound-title { margin-top: 12px; font: 600 24px/1.3 var(--font-display); }
      .notfound-text { margin: 12px auto 0; max-width: 24rem; color: var(--muted); }
      .notfound .contact-links { justify-content: center; margin-top: 28px; }
      .notfound-sign { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--border); font-size: 14px; color: var(--faint); }
      .notfound-sign a { color: var(--text); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
    </style>
  </head>
  <body>
    <main class="notfound">
      <div class="notfound-card rise">
        <p class="notfound-code">404</p>
        <h1 class="notfound-title">This page doesn't exist</h1>
        <p class="notfound-text">The link may be broken, or the page may have moved. Everything I've built is on the home page.</p>
        <div class="contact-links">
          <a class="btn" href="/">Back to home</a>
          <a class="btn" href="/#projects">See projects</a>
        </div>
        <p class="notfound-sign"><a href="/">pol.alzina.dev</a> · Pol Alzina</p>
      </div>
    </main>
  </body>
</html>
